name: homebase

services:
  app:
    image: ghcr.io/ashryverelisa/home-base-system:latest
    build: ./src
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Password must match POSTGRES_PASSWORD below; avoid ";" in it.
      ConnectionStrings__HomeBase: "Host=db;Port=5432;Database=homebase;Username=homebase;Password=change-me"
      Ingest__ApiKey: "change-me"
    volumes:
      - homebase-data:/data

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: homebase
      POSTGRES_USER: homebase
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - homebase-db:/var/lib/postgresql/data

volumes:
  homebase-data:
  homebase-db:
